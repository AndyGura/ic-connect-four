<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10142a" />
    <title>Connect Four Online – Play Free Against a Friend or a Bot</title>
    <meta
      name="description"
      content="Play Connect Four online for free: drop discs, line up four in a row and beat a friend or a bot (Easy, Medium, Hard). No sign-up, runs fully on the Internet Computer."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://cj766-haaaa-aaaau-ahgeq-cai.icp0.io/" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews (Open Graph, X/Twitter). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Connect Four" />
    <meta property="og:title" content="Connect Four Online – Play Free Against a Friend or a Bot" />
    <meta
      property="og:description"
      content="Drop discs, line up four in a row. Play a friend in another tab or challenge a bot. Free, no sign-up."
    />
    <meta property="og:url" content="https://cj766-haaaa-aaaau-ahgeq-cai.icp0.io/" />
    <meta property="og:image" content="https://cj766-haaaa-aaaau-ahgeq-cai.icp0.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A Connect Four board where red has won with four discs on a diagonal" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Connect Four Online – Play Free Against a Friend or a Bot" />
    <meta
      name="twitter:description"
      content="Drop discs, line up four in a row. Play a friend in another tab or challenge a bot. Free, no sign-up."
    />
    <meta name="twitter:image" content="https://cj766-haaaa-aaaau-ahgeq-cai.icp0.io/og-image.png" />

    <!-- Structured data for search engines; data only, never executed,
         so the CSP's script-src does not apply. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Connect Four",
        "url": "https://cj766-haaaa-aaaau-ahgeq-cai.icp0.io/",
        "image": "https://cj766-haaaa-aaaau-ahgeq-cai.icp0.io/og-image.png",
        "description": "Play Connect Four online for free against a friend or a bot. No sign-up, runs fully on the Internet Computer.",
        "genre": ["Board game", "Strategy"],
        "gamePlatform": "Web browser",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "playMode": ["MultiPlayer", "SinglePlayer"],
        "numberOfPlayers": { "@type": "QuantitativeValue", "minValue": 2, "maxValue": 2 },
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <link rel="stylesheet" href="/duel-game-core.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body data-phase="connecting">
    <!-- The 3D board (stage.js): fixed behind everything, never redrawn. -->
    <div id="stage" aria-hidden="true"></div>

    <header>
      <h1>
        <span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        Connect Four
      </h1>
      <div class="header-tools">
        <button id="music-toggle" class="icon-btn" aria-pressed="true" title="Music" aria-label="Music">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 17.5V6.2l10-2.2v11.3" />
            <circle cx="6.5" cy="17.5" r="2.5" />
            <circle cx="16.5" cy="15.3" r="2.5" />
          </svg>
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
        </button>
        <button id="sfx-toggle" class="icon-btn" aria-pressed="true" title="Sound effects" aria-label="Sound effects">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
            <path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" />
            <path class="mute" d="M16 9.5l5 5M21 9.5l-5 5" />
          </svg>
        </button>
        <div class="session">
          <span class="label">Session</span>
          <code id="sid">…</code>
          <button id="new-sid" title="Play as a different session">new</button>
        </div>
      </div>
    </header>

    <aside class="panel">
      <p id="error" class="error" hidden></p>
      <!-- The bot dialog (bots.js): shown in place of #screen while open,
           so a status redraw of #screen never clobbers it. -->
      <section id="bot-challenge-panel" hidden>
        <div class="bot-challenge-header">
          <button id="bot-challenge-back" class="ghost">← Back</button>
          <h2>Play a bot</h2>
        </div>
        <div id="bot-challenge-body" class="bot-challenge-body"></div>
      </section>
      <main id="screen">
        <p class="muted">Connecting…</p>
        <noscript>
          <h2>Play Connect Four online</h2>
          <p>
            Take turns dropping red and yellow discs into a seven-column,
            six-row board. The first player to line up four discs in a row,
            across, down or diagonally, wins. Play a friend from a second
            browser tab or challenge a bot at Easy, Medium or Hard.
          </p>
          <p>This game needs JavaScript. Please enable it to play.</p>
        </noscript>
      </main>
      <footer>
        <p class="muted">
          Your session id is per browser tab — open a second tab to play the
          other seat, or challenge a bot. An idle game can be taken over
          after 150&nbsp;seconds.
        </p>
      </footer>
    </aside>

    <!-- esbuild's bundle of src/app.js (see ../build.js). -->
    <script type="module" src="/app.js"></script>
  </body>
</html>
